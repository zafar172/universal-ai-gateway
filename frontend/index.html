<!DOCTYPE html><html><head><meta charset="UTF-8"><title>AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0f172a;color:#fff}.msg{max-width:85%;padding:12px;border-radius:16px;margin:8px 0}.u{background:#3b82f6;margin-left:auto}.a{background:#1e293b;margin-right:auto;border:1px solid #334155}</style></head>
<body class="flex flex-col h-screen"><div id="l" class="flex flex-col items-center justify-center h-full p-6"><h1 class="text-2xl font-bold mb-4 text-blue-400">AI Gateway</h1><input id="e" type="email" value="validation@test.local" class="p-2 mb-2 bg-slate-800 rounded w-64"><input id="p" type="password" value="SuperSecret123" class="p-2 mb-4 bg-slate-800 rounded w-64"><button onclick="login()" class="p-2 bg-blue-600 rounded w-64">Login</button><p id="err" class="text-red-400 mt-2"></p></div>
<div id="c" class="hidden flex flex-col h-full"><div class="p-4 bg-slate-900 flex justify-between"><h2 class="font-bold">Chat</h2><button onclick="logout()">Logout</button></div><div id="m" class="flex-1 overflow-y-auto p-4"></div><div class="p-2 flex gap-2 bg-slate-900"><input id="i" type="text" class="flex-1 p-2 bg-slate-800 rounded" onkeydown="if(event.keyCode==13)send()"><button onclick="send()" class="p-2 bg-blue-600 rounded">Send</button></div></div>
<script>const A="http://127.0.0.1:8000";let t=localStorage.getItem("t"),id=localStorage.getItem("id");if(t)show();async function login(){try{let r=await fetch(A+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e.value,password:p.value})});let d=await r.json();if(!r.ok)throw new Error(d.detail);t=d.access_token;localStorage.setItem("t",t);let c=await fetch(A+"/v1/conversations",{method:"POST",headers:{"Authorization":"Bearer "+t}});let cd=await c.json();id=cd.conversation_id;localStorage.setItem("id",id);show()}catch(x){err.textContent=x.message}}function show(){l.classList.add("hidden");c.classList.remove("hidden")}function logout(){localStorage.clear();location.reload()}async function send(){let msg=i.value.trim();if(!msg)return;i.value="";add("u",msg);try{let r=await fetch(A+"/v1/conversations/"+id+"/chat",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+t},body:JSON.stringify({messages:[{role:"user",content:msg}],routing_strategy:"balanced"})});let d=await r.json();add("a",d.content+"\n("+d.provider+")")}catch(x){add("a","Error")}}function add(r,t){let d=document.createElement("div");d.className="msg "+(r=="u"?"u":"a");d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight}</script></body></html>
