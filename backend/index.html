<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0}#l,#c{position:fixed;inset:0;display:flex;flex-direction:column}#l{align-items:center;justify-content:center;padding:20px}#l input,#l button{width:100%;max-width:300px;margin-bottom:12px;padding:12px;border-radius:8px;border:none;background:#1e293b;color:#fff}#l button{background:#2563eb}#c header{padding:16px;background:#0f172a;border-bottom:1px solid #334155;display:flex;justify-content:space-between}#m{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px}.msg{max-width:85%;padding:12px;border-radius:16px;margin-bottom:12px}.u{background:#2563eb;margin-left:auto}.a{background:#1e293b;margin-right:auto;border:1px solid #334155}#bar{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#0f172a;border-top:1px solid #334155;display:flex;gap:8px}#i{flex:1;padding:12px;border-radius:8px;border:none;background:#1e293b;color:#fff}#send{padding:12px 20px;border-radius:8px;border:none;background:#2563eb;color:#fff}.hidden{display:none}</style></head>
<body><div id="l"><h1 style="font-size:24px;color:#60a5fa;margin-bottom:24px">AI Gateway</h1><input id="e" type="email" value="validation@test.local"><input id="p" type="password" value="SuperSecret123"><button onclick="login()">Login</button><p id="err" style="color:#f87171"></p></div><div id="c" class="hidden"><header><h2>Chat</h2><button onclick="logout()" style="background:transparent;color:#94a3b8;border:none">Logout</button></header><div id="m"></div><div id="bar"><input id="i" type="text" onkeydown="if(event.keyCode==13)send()"><button id="send" onclick="send()">Send</button></div></div>
<script>const A="http://127.0.0.1:8000";let t=localStorage.getItem("t"),id=localStorage.getItem("id");if(t&&id){l.classList.add("hidden");c.classList.remove("hidden")}async function login(){try{let r=await fetch(A+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e.value,password:p.value})});let d=await r.json();if(!r.ok)throw new Error(d.detail);t=d.access_token;localStorage.setItem("t",t);let c=await fetch(A+"/v1/conversations",{method:"POST",headers:{"Authorization":"Bearer "+t}});let cd=await c.json();id=cd.conversation_id;localStorage.setItem("id",id);l.classList.add("hidden");c.classList.remove("hidden")}catch(x){err.textContent=x.message}}function logout(){localStorage.clear();location.reload()}async function send(){let msg=i.value.trim();if(!msg)return;i.value="";add("u",msg);try{let r=await fetch(A+"/v1/conversations/"+id+"/chat",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+t},body:JSON.stringify({messages:[{role:"user",content:msg}],routing_strategy:"balanced"})});let d=await r.json();add("a",d.content+" (via "+d.provider+")")}catch(x){add("a","Error")}}function add(r,t){let d=document.createElement("div");d.className="msg "+(r=="u"?"u":"a");d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight}</script></body></html>
